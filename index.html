<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>残りタスク&時間トラッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     見た目の方針:丸っこいフォント+パステルカラーで「かわいく」。
     情報自体は「バカでも理解できる」を最優先に、数字とバー(ゲージ)で
     直感的にわかるようにする。
     色の意味: 緑=余裕 / 黄=注意 / 赤+炎=炎上(締切ヤバい)
     ============================================================ */
  :root{
    --bg:#fff6ef;
    --card:#ffffff;
    --text:#4a3f3f;
    --sub:#a89a95;
    --border:#f1e3d8;
    --safe:#8fd694;
    --safe-bg:#e9f9ea;
    --warn:#ffc861;
    --warn-bg:#fff5e2;
    --fire:#ff6b6b;
    --fire-bg:#ffe8e8;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family:"M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:22px 16px 70px;
    transition:background .5s ease;
  }
  /* どれか1つでも案件が炎上したら<body>にこのクラスがJSから付き、画面全体が赤くパルスする */
  body.fire-alert{ animation:bg-fire-pulse 1.3s ease-in-out infinite; }
  @keyframes bg-fire-pulse{
    0%,100%{ background-color:#ffc9c9; }
    50%{ background-color:#ff8f8f; }
  }
  h1{ font-size:16px; color:var(--sub); font-weight:700; margin:2px 0 18px; position:relative; z-index:1; }

  .card{
    width:100%;
    max-width:440px;
    background:var(--card);
    border-radius:22px;
    padding:20px 20px;
    margin-bottom:14px;
    box-shadow:0 4px 14px rgba(180,140,110,0.08);
  }

  /* ---------- ①「今、何をやっているか」を表示する最重要カード ---------- */
  #currentTaskCard{ text-align:center; border:2px solid transparent; }
  #currentTaskCard.status-warn{ border-color:var(--warn); background:var(--warn-bg); }
  #currentTaskCard.status-fire{ border-color:var(--fire); background:var(--fire-bg); animation:fireshake 1.4s infinite; }
  #currentTaskName{ font-size:15px; font-weight:800; margin-bottom:2px; }
  #currentTaskEmpty{ font-size:13px; color:var(--sub); padding:6px 0; }

  .big-number{
    font-size:50px;
    font-weight:800;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .big-label{ font-size:12px; color:var(--sub); margin-top:6px; font-weight:700; }

  .gauge-track{
    width:100%;
    height:16px;
    background:#f2e9e2;
    border-radius:999px;
    overflow:hidden;
    margin-top:14px;
  }
  .gauge-fill{
    height:100%;
    border-radius:999px;
    transition:width .5s ease, background-color .5s ease;
  }
  .gauge-fill.safe{ background:var(--safe); }
  .gauge-fill.warn{ background:var(--warn); }
  .gauge-fill.fire{ background:var(--fire); }

  /* ---------- 設定エリア/追加フォーム共通のグリッド ---------- */
  .settings-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .settings-grid label{ display:block; font-size:11px; color:var(--sub); font-weight:700; margin-bottom:4px; }
  input[type="time"], input[type="number"], input[type="text"]{
    width:100%;
    padding:10px;
    border-radius:12px;
    border:2px solid var(--border);
    background:#fffdfb;
    color:var(--text);
    font-family:inherit;
    font-size:16px;
  }
  input:focus{ outline:none; border-color:#ffc0a0; }

  #addForm .settings-grid{ grid-template-columns:1.4fr 1fr 1fr; margin-bottom:10px; }
  #addBtn{
    width:100%; padding:12px; border:none; border-radius:14px;
    background:#ffab7a; color:#fff; font-family:inherit; font-size:15px; font-weight:800;
  }

  /* ---------- 案件(タスク)ごとのカード ---------- */
  #taskList{ width:100%; max-width:440px; }
  .task-swipe-wrap{
    position:relative;
    border-radius:20px;
    margin-bottom:12px;
    overflow:hidden; /* スワイプ中、下の赤い削除レイヤーがはみ出さないように */
  }
  .swipe-bg{
    position:absolute; inset:0;
    background:var(--fire);
    color:#fff;
    display:flex; align-items:center; justify-content:flex-end;
    padding-right:22px;
    font-weight:800; font-size:14px;
  }
  .task-card{
    position:relative;
    background:var(--card);
    border-radius:20px;
    padding:16px 18px;
    box-shadow:0 4px 14px rgba(180,140,110,0.08);
    border:2px solid transparent;
    touch-action:pan-y; /* 縦スクロールは邪魔せず、横方向だけJSでスワイプ判定する */
  }
  .task-card.status-warn{ border-color:var(--warn-bg); background:var(--warn-bg); }
  .task-card.status-fire{ border-color:#ffb3b3; background:var(--fire-bg); animation:fireshake 1.4s infinite; }
  .task-card.status-done{ opacity:.55; animation:none; }
  @keyframes fireshake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-1px) rotate(-0.3deg); }
    75%{ transform:translateX(1px) rotate(0.3deg); }
  }

  .flame-icon{
    display:none; position:absolute; top:-14px; right:-8px; font-size:30px;
    animation:flame-flicker .7s ease-in-out infinite alternate;
    filter:drop-shadow(0 2px 3px rgba(255,90,90,0.5));
  }
  .status-fire .flame-icon{ display:block; }
  @keyframes flame-flicker{
    0%{ transform:scale(1) rotate(-4deg); }
    100%{ transform:scale(1.18) rotate(4deg); }
  }

  .task-top{ display:flex; align-items:flex-start; gap:8px; }
  .task-name{ flex:1; font-size:16px; font-weight:700; word-break:break-word; }
  .task-name.done{ text-decoration:line-through; }
  .icon-btn{
    background:none; border:none; color:var(--sub); font-size:16px; padding:2px 6px; flex-shrink:0;
  }

  .task-meta{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:8px; font-size:12px; color:var(--sub); font-weight:700;
  }
  .task-remaining{ font-size:14px; font-variant-numeric:tabular-nums; }
  .fire-badge{
    display:none; align-items:center; gap:4px; background:var(--fire); color:#fff;
    border-radius:999px; padding:2px 10px; font-size:12px; font-weight:800; margin-left:8px;
  }
  .status-fire .fire-badge{ display:inline-flex; }

  /* 開始/終了ボタン */
  .task-actions{ display:flex; gap:8px; margin-top:10px; }
  .task-actions button{
    flex:1; padding:9px; border-radius:12px; border:none;
    font-family:inherit; font-size:13px; font-weight:800;
  }
  .btn-start{ background:#fff; border:2px solid #ffab7a !important; color:#e08a55; }
  .btn-end{ background:#ffab7a; color:#fff; }
  .doing-tag{
    display:inline-block; background:#ffe3d1; color:#c96a35; font-size:11px; font-weight:800;
    border-radius:999px; padding:2px 10px; margin-left:6px;
  }
  .undo-link{
    display:block; text-align:center; font-size:11px; color:var(--sub); margin-top:8px; text-decoration:underline;
    background:none; border:none; font-family:inherit;
  }

  /* インライン編集フォーム */
  .edit-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .edit-actions{ display:flex; gap:8px; margin-top:8px; }
  .edit-actions button{ flex:1; padding:8px; border-radius:10px; border:none; font-family:inherit; font-weight:800; font-size:13px; }
  .btn-save{ background:#8fd694; color:#fff; }
  .btn-cancel{ background:#f2e9e2; color:var(--text); }

  #notifyBtn{
    width:100%; max-width:440px; padding:14px; border-radius:16px;
    border:2px dashed #e3cdbd; background:transparent; color:var(--sub);
    font-family:inherit; font-size:13px; font-weight:700; margin-top:6px;
  }
  .empty-hint{ max-width:440px; text-align:center; color:var(--sub); font-size:13px; padding:20px 10px; }

  .score-row{ display:flex; justify-content:space-around; }
  .score-item{ text-align:center; }
  .score-num{ display:block; font-size:26px; font-weight:800; line-height:1; }
  .score-label{ font-size:11px; color:var(--sub); font-weight:700; margin-top:4px; display:block; }
  .score-item.safe .score-num{ color:#4caf7a; }
  .score-item.fire .score-num{ color:var(--fire); }
  .score-item.burn .score-num{ color:#8a5a5a; }
</style>
</head>
<body>

<h1>今日の残りタスク&時間</h1>

<!-- ===== ① 今まさに作業中の案件(開始ボタンを押した案件)を最上部に大きく表示 ===== -->
<div class="card" id="currentTaskCard">
  <div id="currentTaskEmpty">作業中の案件はありません。下のリストで「開始」を押してください。</div>
  <div id="currentTaskBody" style="display:none;">
    <div id="currentTaskName"></div>
    <div class="big-number" id="currentTaskRemaining">--:--</div>
    <div class="big-label">この案件の残り時間</div>
    <div class="gauge-track"><div class="gauge-fill safe" id="currentTaskGauge" style="width:100%"></div></div>
  </div>
</div>

<!-- ===== ② 就業時間までの全体カウント(こちらは炎上しない仕様のまま) ===== -->
<div class="card" id="overallCard">
  <div class="big-number" id="remainingTimeNum">--:--:--</div>
  <div class="big-label">終業までの残り時間</div>
  <div class="gauge-track"><div class="gauge-fill safe" id="overallGauge" style="width:100%"></div></div>
</div>

<!-- ===== ③ 今日のスコア(ゲーム性) ===== -->
<div class="card" id="scoreCard">
  <div class="score-row">
    <div class="score-item safe"><span class="score-num" id="scoreSafe">0</span><span class="score-label">セーフクリア</span></div>
    <div class="score-item fire"><span class="score-num" id="scoreFire">0</span><span class="score-label">炎上クリア</span></div>
    <div class="score-item burn"><span class="score-num" id="scoreBurn">0</span><span class="score-label">全焼</span></div>
  </div>
</div>

<!-- ===== ④ 全体設定 ===== -->
<div class="card">
  <div class="settings-grid">
    <div><label>開始時刻</label><input type="time" id="startTimeInput"></div>
    <div><label>終業時刻</label><input type="time" id="endTimeInput"></div>
    <div><label>通知間隔(分)</label><input type="number" id="notifyIntervalInput" min="1" value="15"></div>
    <div><label>炎上ライン(残り%)</label><input type="number" id="fireLineInput" min="1" max="90" value="20"></div>
  </div>
</div>

<!-- ===== ⑤ 案件の追加フォーム ===== -->
<div class="card" id="addForm">
  <div class="settings-grid">
    <div><label>案件名</label><input type="text" id="taskInput" placeholder="例: バナー修正"></div>
    <div><label>締切時刻</label><input type="time" id="deadlineInput"></div>
    <div><label>見積(分)</label><input type="number" id="estimateInput" min="1" value="60"></div>
  </div>
  <button id="addBtn">＋ 案件を追加</button>
</div>

<!-- ===== ⑥ 案件一覧(炎上度順に自動並び替え) ===== -->
<div id="taskList"></div>
<p class="empty-hint" id="emptyHint">案件を追加すると、ここに締切までのバーが並びます。</p>

<button id="notifyBtn">通知をオンにする(炎上したら知らせてくれる)</button>

<script>
/* =====================================================================
   全体構成(8パート)
   1. データ保存/読込(全体設定・スコア・案件一覧をlocalStorageに記憶)
   2. 共通ヘルパー(時刻計算・ステータス判定・タスク検索)
   3. 全体カウント(終業時刻まで)の描画
   4. 「現在作業中」カードの描画
   5. 案件一覧の描画(炎上度で自動ソート/開始・終了/編集/スワイプ削除)
   6. 案件の追加
   7. 通知(炎上への切り替わり検知+定期通知)
   8. メインループ(1秒ごとに全部更新)
   ===================================================================== */

/* ---------- 1. データの保存・読み込み ---------- */
// 案件データ構造: { id, text, deadline:"HH:MM", estimateMin, state:'todo'|'doing'|'done', burnedCounted }
let tasks = JSON.parse(localStorage.getItem('scheduleTasksV3') || 'null');

// 旧バージョン(V2: done真偽値のみ)のデータが残っていたら、新しい形に変換して引き継ぐ
if (!tasks){
  const legacy = JSON.parse(localStorage.getItem('scheduleTasksV2') || '[]');
  tasks = legacy.map((t) => ({
    id: genId(),
    text: t.text,
    deadline: t.deadline || '18:00',
    estimateMin: t.estimateMin || 60,
    state: t.done ? 'done' : 'todo',
    burnedCounted: !!t.burnedCounted,
  }));
}
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

let startTime      = localStorage.getItem('scheduleStartTime') || '09:00';
let endTime        = localStorage.getItem('scheduleEndTime') || '18:00';
let notifyInterval = Number(localStorage.getItem('scheduleNotifyInterval') || 15);
let fireLine       = Number(localStorage.getItem('scheduleFireLine') || 20);

function saveTasks(){ localStorage.setItem('scheduleTasksV3', JSON.stringify(tasks)); }
function saveSettings(){
  localStorage.setItem('scheduleStartTime', startTime);
  localStorage.setItem('scheduleEndTime', endTime);
  localStorage.setItem('scheduleNotifyInterval', String(notifyInterval));
  localStorage.setItem('scheduleFireLine', String(fireLine));
}

function todayStr(){ return new Date().toISOString().slice(0, 10); }
let scoreData = JSON.parse(localStorage.getItem('scheduleScore') || 'null');
if (!scoreData || scoreData.date !== todayStr()){
  scoreData = { date: todayStr(), safeClears: 0, fireClears: 0, burnedOut: 0 };
}
function saveScore(){ localStorage.setItem('scheduleScore', JSON.stringify(scoreData)); }
function renderScore(){
  document.getElementById('scoreSafe').textContent = scoreData.safeClears;
  document.getElementById('scoreFire').textContent = scoreData.fireClears;
  document.getElementById('scoreBurn').textContent = scoreData.burnedOut;
}

/* ---------- 画面要素の取得 ---------- */
const remainingTimeNum    = document.getElementById('remainingTimeNum');
const overallGauge        = document.getElementById('overallGauge');
const startTimeInput      = document.getElementById('startTimeInput');
const endTimeInput        = document.getElementById('endTimeInput');
const notifyIntervalInput = document.getElementById('notifyIntervalInput');
const fireLineInput       = document.getElementById('fireLineInput');
const taskInput           = document.getElementById('taskInput');
const deadlineInput       = document.getElementById('deadlineInput');
const estimateInput       = document.getElementById('estimateInput');
const addBtn              = document.getElementById('addBtn');
const taskListEl          = document.getElementById('taskList');
const emptyHint           = document.getElementById('emptyHint');
const notifyBtn           = document.getElementById('notifyBtn');
const currentTaskCard     = document.getElementById('currentTaskCard');
const currentTaskEmpty    = document.getElementById('currentTaskEmpty');
const currentTaskBody     = document.getElementById('currentTaskBody');
const currentTaskName     = document.getElementById('currentTaskName');
const currentTaskRemaining= document.getElementById('currentTaskRemaining');
const currentTaskGauge    = document.getElementById('currentTaskGauge');

startTimeInput.value = startTime;
endTimeInput.value = endTime;
notifyIntervalInput.value = notifyInterval;
fireLineInput.value = fireLine;
deadlineInput.value = endTime;

startTimeInput.addEventListener('change', () => { startTime = startTimeInput.value; saveSettings(); });
endTimeInput.addEventListener('change', () => { endTime = endTimeInput.value; saveSettings(); });
notifyIntervalInput.addEventListener('change', () => { notifyInterval = Number(notifyIntervalInput.value) || 15; saveSettings(); });
fireLineInput.addEventListener('change', () => { fireLine = Number(fireLineInput.value) || 20; saveSettings(); });

/* ---------- 2. 共通ヘルパー ---------- */
function timeStrToDate(hhmm){
  const [h, m] = hhmm.split(':').map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}
// 案件専用:残り%からsafe/warn/fireを判定(炎上はここだけ)
function statusFromPct(pct){
  if (pct <= fireLine) return 'fire';
  if (pct <= 50) return 'warn';
  return 'safe';
}
// 全体(終業時刻)専用:こちらは炎上にはならない
function overallStatusFromPct(pct){ return pct <= 30 ? 'warn' : 'safe'; }

// 案件1件の「今の状態」(ステータス/残り%/残りミリ秒)を計算する
function computeTaskStatus(task){
  if (task.state === 'done') return { status:'done', pct:100, remainMs:0 };
  const now = new Date();
  const deadlineDate = timeStrToDate(task.deadline);
  const remainMs = deadlineDate - now;
  const totalMs = task.estimateMin * 60000;
  const pct = Math.max(0, Math.min(100, (remainMs / totalMs) * 100));
  return { status: statusFromPct(pct), pct, remainMs };
}
function findTaskIndex(id){ return tasks.findIndex((t) => t.id === id); }
function formatHHMM(ms){
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const hh = String(Math.floor(totalSec / 3600)).padStart(2, '0');
  const mm = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
  return `${hh}:${mm}`;
}

/* ---------- 3. 全体(終業時刻まで)のカウント ---------- */
function updateOverall(){
  const now = new Date();
  const start = timeStrToDate(startTime);
  const end = timeStrToDate(endTime);
  const diffMs = end - now;
  const totalMs = Math.max(end - start, 1);

  if (diffMs <= 0){
    remainingTimeNum.textContent = '終業時刻を過ぎています';
    overallGauge.style.width = '0%';
    overallGauge.className = 'gauge-fill warn';
    return;
  }
  const totalSec = Math.floor(diffMs / 1000);
  const hh = String(Math.floor(totalSec / 3600)).padStart(2, '0');
  const mm = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
  const ss = String(totalSec % 60).padStart(2, '0');
  remainingTimeNum.textContent = `${hh}:${mm}:${ss}`;

  const pct = Math.max(0, Math.min(100, (diffMs / totalMs) * 100));
  overallGauge.style.width = pct + '%';
  overallGauge.className = 'gauge-fill ' + overallStatusFromPct(pct);
}

/* ---------- 4. 「現在作業中」カードの描画 ---------- */
function renderCurrentTask(){
  const doing = tasks.find((t) => t.state === 'doing');
  currentTaskCard.classList.remove('status-warn', 'status-fire');

  if (!doing){
    currentTaskEmpty.style.display = 'block';
    currentTaskBody.style.display = 'none';
    return;
  }
  currentTaskEmpty.style.display = 'none';
  currentTaskBody.style.display = 'block';

  const { status, pct, remainMs } = computeTaskStatus(doing);
  currentTaskName.textContent = doing.text;
  currentTaskRemaining.textContent = remainMs <= 0 ? '締切オーバー' : formatHHMM(remainMs);
  currentTaskGauge.style.width = Math.max(0, pct) + '%';
  currentTaskGauge.className = 'gauge-fill ' + status;
  if (status === 'warn' || status === 'fire'){
    currentTaskCard.classList.add('status-' + status);
  }
}

/* ---------- 5. 案件一覧の描画 ---------- */
// 鉛筆アイコンを押して「今どのカードが編集中か」を覚えておく(保存はしない一時的な状態)
const editingIds = new Set();

function startTask(id){
  const idx = findTaskIndex(id);
  if (idx === -1) return;
  // 「今作業中」は常に1件だけにする(あちこち同時進行だと逆にゲージが分散して分かりにくいため)
  tasks.forEach((t) => { if (t.state === 'doing') t.state = 'todo'; });
  tasks[idx].state = 'doing';
  saveTasks();
  renderAll();
}
function endTask(id){
  const idx = findTaskIndex(id);
  if (idx === -1) return;
  const { status } = computeTaskStatus(tasks[idx]);
  if (status === 'fire') scoreData.fireClears++; else scoreData.safeClears++;
  saveScore();
  tasks[idx].state = 'done';
  saveTasks();
  renderAll();
}
function undoTask(id){
  const idx = findTaskIndex(id);
  if (idx === -1) return;
  tasks[idx].state = 'todo';
  saveTasks();
  renderAll();
}
function deleteTaskById(id){
  const idx = findTaskIndex(id);
  if (idx !== -1){ tasks.splice(idx, 1); saveTasks(); }
  renderAll();
}
function updateTaskFields(id, deadline, estimateMin, text){
  const idx = findTaskIndex(id);
  if (idx === -1) return;
  tasks[idx].deadline = deadline;
  tasks[idx].estimateMin = estimateMin;
  tasks[idx].text = text;
  editingIds.delete(id);
  saveTasks();
  renderAll();
}

// 左スワイプで削除するための共通処理(完了済みカードだけに使う)
function attachSwipeToDelete(cardEl, id){
  let startX = 0, dx = 0, dragging = false;
  const threshold = 90;

  cardEl.addEventListener('pointerdown', (e) => {
    dragging = true;
    startX = e.clientX;
    cardEl.setPointerCapture(e.pointerId);
    cardEl.style.transition = 'none';
  });
  cardEl.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dx = Math.min(0, e.clientX - startX); // 左方向(マイナス)にしか動かさない
    cardEl.style.transform = `translateX(${dx}px)`;
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    cardEl.style.transition = 'transform .25s ease';
    if (dx < -threshold){
      cardEl.style.transform = 'translateX(-120%)';
      if (navigator.vibrate) navigator.vibrate(15); // 消えた瞬間の「気持ちよさ」を振動でも
      setTimeout(() => deleteTaskById(id), 220);
    } else {
      cardEl.style.transform = 'translateX(0)';
    }
    dx = 0;
  }
  cardEl.addEventListener('pointerup', endDrag);
  cardEl.addEventListener('pointercancel', endDrag);
}

function renderTasks(){
  // ---- 各案件の現在ステータスを先に全部計算しておく ----
  tasks.forEach((t) => {
    const r = computeTaskStatus(t);
    t._currentStatus = r.status;
    t._pct = r.pct;
    t._remainMs = r.remainMs;
    if (t.state !== 'done' && r.remainMs <= 0 && !t.burnedCounted){
      t.burnedCounted = true;
      scoreData.burnedOut++;
      saveScore();
      saveTasks();
    }
  });

  // ---- 画面全体の炎上演出(1件でも炎上中があれば赤くパルス) ----
  const anyFire = tasks.some((t) => t.state !== 'done' && t._currentStatus === 'fire');
  document.body.classList.toggle('fire-alert', anyFire);

  // ---- 「やばさ順」に並び替えた表示専用のコピーを作る(保存データの順序はいじらない) ----
  const rank = { fire: 0, warn: 1, safe: 2, done: 3 };
  const sorted = [...tasks].sort((a, b) => {
    const diff = rank[a._currentStatus] - rank[b._currentStatus];
    if (diff !== 0) return diff;
    if (a._currentStatus === 'done') return 0; // 完了同士は元の順番のまま
    return a._pct - b._pct; // 残り%が少ない(=ヤバい)ほうを上に
  });

  emptyHint.style.display = sorted.length === 0 ? 'block' : 'none';
  taskListEl.innerHTML = '';

  sorted.forEach((task) => {
    const isEditing = editingIds.has(task.id);
    const status = task._currentStatus;

    const wrap = document.createElement('div');
    wrap.className = 'task-swipe-wrap';

    // 完了済みカードの背後に、スワイプすると見える赤い「削除」レイヤー
    if (task.state === 'done'){
      const bg = document.createElement('div');
      bg.className = 'swipe-bg';
      bg.textContent = '🗑 削除';
      wrap.appendChild(bg);
    }

    const card = document.createElement('div');
    card.className = 'task-card status-' + status;

    const flameIcon = document.createElement('span');
    flameIcon.className = 'flame-icon';
    flameIcon.textContent = '🔥';
    flameIcon.setAttribute('aria-hidden', 'true');
    card.appendChild(flameIcon);

    // ---- 上段:案件名+編集/削除ボタン ----
    const top = document.createElement('div');
    top.className = 'task-top';

    const name = document.createElement('div');
    name.className = 'task-name' + (task.state === 'done' ? ' done' : '');
    name.textContent = task.text;
    if (task.state === 'doing'){
      const tag = document.createElement('span');
      tag.className = 'doing-tag';
      tag.textContent = '作業中';
      name.appendChild(tag);
    }
    top.appendChild(name);

    if (task.state !== 'done' && !isEditing){
      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn';
      editBtn.textContent = '✎';
      editBtn.setAttribute('aria-label', '編集');
      editBtn.addEventListener('click', () => { editingIds.add(task.id); renderAll(); });
      top.appendChild(editBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn';
      delBtn.textContent = '✕';
      delBtn.setAttribute('aria-label', '削除');
      delBtn.addEventListener('click', () => deleteTaskById(task.id));
      top.appendChild(delBtn);
    }
    card.appendChild(top);

    if (isEditing){
      // ---- 編集モード:締切・見積・案件名を書き換えるフォーム ----
      const grid = document.createElement('div');
      grid.className = 'edit-grid';

      const dlWrap = document.createElement('div');
      dlWrap.innerHTML = '<label style="font-size:11px;color:var(--sub);font-weight:700;">締切時刻</label>';
      const dlInput = document.createElement('input');
      dlInput.type = 'time'; dlInput.value = task.deadline;
      dlWrap.appendChild(dlInput);

      const estWrap = document.createElement('div');
      estWrap.innerHTML = '<label style="font-size:11px;color:var(--sub);font-weight:700;">見積(分)</label>';
      const estInput = document.createElement('input');
      estInput.type = 'number'; estInput.min = '1'; estInput.value = task.estimateMin;
      estWrap.appendChild(estInput);

      grid.append(dlWrap, estWrap);
      card.appendChild(grid);

      const nameWrap = document.createElement('div');
      nameWrap.style.marginTop = '8px';
      nameWrap.innerHTML = '<label style="font-size:11px;color:var(--sub);font-weight:700;">案件名</label>';
      const nameInput = document.createElement('input');
      nameInput.type = 'text'; nameInput.value = task.text;
      nameWrap.appendChild(nameInput);
      card.appendChild(nameWrap);

      const actions = document.createElement('div');
      actions.className = 'edit-actions';
      const saveBtn = document.createElement('button');
      saveBtn.className = 'btn-save';
      saveBtn.textContent = '保存';
      saveBtn.addEventListener('click', () => {
        updateTaskFields(task.id, dlInput.value || task.deadline, Number(estInput.value) || task.estimateMin, nameInput.value.trim() || task.text);
      });
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn-cancel';
      cancelBtn.textContent = 'キャンセル';
      cancelBtn.addEventListener('click', () => { editingIds.delete(task.id); renderAll(); });
      actions.append(saveBtn, cancelBtn);
      card.appendChild(actions);

    } else {
      // ---- 通常モード:ゲージ+締切/残り時間+開始・終了ボタン ----
      const gaugeTrack = document.createElement('div');
      gaugeTrack.className = 'gauge-track';
      const gaugeFill = document.createElement('div');
      gaugeFill.className = 'gauge-fill ' + (task.state === 'done' ? 'safe' : status);
      gaugeFill.style.width = task._pct + '%';
      gaugeTrack.appendChild(gaugeFill);
      card.appendChild(gaugeTrack);

      const meta = document.createElement('div');
      meta.className = 'task-meta';
      const leftMeta = document.createElement('span');
      leftMeta.textContent = `締切 ${task.deadline}`;
      const rightMeta = document.createElement('span');
      rightMeta.style.display = 'flex';
      rightMeta.style.alignItems = 'center';
      const remainSpan = document.createElement('span');
      remainSpan.className = 'task-remaining';
      if (task.state === 'done') remainSpan.textContent = '完了';
      else if (task._remainMs <= 0) remainSpan.textContent = '締切オーバー';
      else remainSpan.textContent = `残り ${formatHHMM(task._remainMs)}`;
      const fireBadge = document.createElement('span');
      fireBadge.className = 'fire-badge';
      fireBadge.textContent = '🔥 炎上中';
      rightMeta.append(remainSpan, fireBadge);
      meta.append(leftMeta, rightMeta);
      card.appendChild(meta);

      if (task.state !== 'done'){
        const actions = document.createElement('div');
        actions.className = 'task-actions';
        if (task.state === 'todo'){
          const startBtn = document.createElement('button');
          startBtn.className = 'btn-start';
          startBtn.textContent = '▶ 作業開始';
          startBtn.addEventListener('click', () => startTask(task.id));
          actions.appendChild(startBtn);
        }
        const endBtn = document.createElement('button');
        endBtn.className = 'btn-end';
        endBtn.textContent = '✓ 作業終了';
        endBtn.addEventListener('click', () => endTask(task.id));
        actions.appendChild(endBtn);
        card.appendChild(actions);
      } else {
        // 誤って「終了」を押した時のための、控えめな取り消しリンク
        const undo = document.createElement('button');
        undo.className = 'undo-link';
        undo.textContent = '間違えた場合は元に戻す';
        undo.addEventListener('click', () => undoTask(task.id));
        card.appendChild(undo);
      }
    }

    wrap.appendChild(card);
    taskListEl.appendChild(wrap);

    // 完了済みカードだけ、左スワイプで削除できるようにする
    if (task.state === 'done'){
      attachSwipeToDelete(card, task.id);
    }
  });
}

// 上部の「現在作業中」カード・案件一覧をまとめて再描画するショートカット
function renderAll(){
  renderCurrentTask();
  renderTasks();
  renderScore();
}

/* ---------- 6. 案件の追加 ---------- */
function addTask(){
  const text = taskInput.value.trim();
  if (!text) return;
  const deadline = deadlineInput.value || endTime;
  const estimateMin = Number(estimateInput.value) || 60;
  tasks.push({ id: genId(), text, deadline, estimateMin, state: 'todo', burnedCounted: false });
  saveTasks();
  renderAll();
  taskInput.value = '';
  taskInput.focus();
}
addBtn.addEventListener('click', addTask);
taskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });

/* ---------- 7. 通知 ---------- */
let notifyEnabled = false;
let lastPeriodicNotifyAt = 0;
let prevStatusMap = {};

notifyBtn.addEventListener('click', () => {
  if (!('Notification' in window)){ alert('この端末・ブラウザは通知に対応していません'); return; }
  Notification.requestPermission().then((permission) => {
    if (permission === 'granted'){
      notifyEnabled = true;
      notifyBtn.textContent = '通知オン(このタブを開いたままにしてね)';
      lastPeriodicNotifyAt = Date.now();
    } else {
      alert('通知が許可されませんでした。ブラウザの設定から許可してください。');
    }
  });
});

function playBeep(freq = 880, duration = 300){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = freq;
  osc.connect(ctx.destination);
  osc.start();
  setTimeout(() => { osc.stop(); ctx.close(); }, duration);
}
function vibrate(pattern){ if (navigator.vibrate) navigator.vibrate(pattern); }
function sendNotification(title, body, tag){ if (notifyEnabled) new Notification(title, { body, tag }); }

function checkFireTransitions(){
  tasks.forEach((task) => {
    if (task.state === 'done') return;
    const prev = prevStatusMap[task.id];
    const now = task._currentStatus;
    if (prev !== 'fire' && now === 'fire'){
      sendNotification('🔥 炎上モード突入', `「${task.text}」の残りが${fireLine}%を切りました！`, 'fire-' + task.id);
      playBeep(1200, 400);
      vibrate([100, 60, 100, 60, 200]);
    }
    prevStatusMap[task.id] = now;
  });
}
function periodicNotify(){
  const remainingCount = tasks.filter((t) => t.state !== 'done').length;
  const fireTasks = tasks.filter((t) => t.state !== 'done' && t._currentStatus === 'fire').map((t) => t.text);
  let body = `残りタスク ${remainingCount}件`;
  if (fireTasks.length > 0) body += ` / 🔥炎上中: ${fireTasks.join('、')}`;
  sendNotification('スケジュール確認', body, 'periodic');
  playBeep();
  vibrate([200, 100, 200]);
  lastPeriodicNotifyAt = Date.now();
}

/* ---------- 8. メインループ ---------- */
setInterval(() => {
  updateOverall();
  renderAll();
  checkFireTransitions();
  const intervalMs = notifyInterval * 60 * 1000;
  if (Date.now() - lastPeriodicNotifyAt >= intervalMs) periodicNotify();
}, 1000);

/* ---------- 初期描画 ---------- */
updateOverall();
renderAll();
</script>
